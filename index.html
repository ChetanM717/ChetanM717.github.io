<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Tutor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">📚 Topic Tutor</div>
</header>

<main>

  <section class="hero">
    <p class="tag">YOUR PERSONAL STUDY HELPER</p>

    <h1>Learn Any Topic.<br><span>Understand Everything.</span></h1>

    <p class="intro">
      Enter a topic and Topic Tutor will help you learn it in a simple,
      student-friendly way.
    </p>

    <div class="search-box">
      <input
        type="text"
        id="topicInput"
        placeholder="Enter a topic...">
      <button onclick="teachTopic()">Teach Me</button>
    </div>
  </section>

  <section id="result" class="result hidden">

    <h2 id="topicTitle"></h2>

    <div class="lesson">
      <h3>📖 Simple Explanation</h3>
      <p id="explanation"></p>
    </div>

    <div class="lesson">
      <h3>💡 Key Points</h3>
      <ul id="keyPoints"></ul>
    </div>

    <div class="lesson">
      <h3>🧠 Quick Quiz</h3>
      <p id="quizQuestion"></p>
      <div id="quizOptions"></div>
      <p id="quizResult"></p>
    </div>

  </section>

</main>

<footer>
  <p>© 2026 Topic Tutor • Learn Smarter 🚀</p>
</footer>

<script src="script.js"></script>

</body>
</html>
